# Real-call verification config: normal aliases plus a deliberately broken
# first route (pro-retry) for acceptance item 6 (retry/failover evidence).
# Adjust base_url / model ids to the actual DeepSeek platform documentation.
# NOTE: circuit threshold is raised so the broken route never trips it during verification.

service: { name: my-llm-gateway, host: 127.0.0.1, port: 8000 }

auth:
  gateway_keys: ["${GATEWAY_API_KEY}"]

database: { path: data/gateway-verify.db }

retry:
  max_attempts: 3
  base_delay_seconds: 0.25
  max_delay_seconds: 4.0
  jitter: 0.25
  retryable_statuses: [408, 409, 429, 500, 502, 503, 504]

circuit_breaker:
  failure_threshold: 100   # keep the broken route selectable throughout the run
  cooldown_seconds: 30

rate_limit: { requests_per_minute: 100000, burst: 1000 }

structured_output: { max_repair_rounds: 1 }

stream_checkpoint: { enabled: false, interval_seconds: 1.0, max_chars: 20000 }

masking:
  enabled: false
  rules:
    secret_key: { enabled: true }
    bank_card: { enabled: true }
    id_card: { enabled: true }
    phone: { enabled: true }
    email: { enabled: true }

providers:
  deepseek_responses:
    protocol: openai_responses
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    enabled: true
    timeout: { connect_seconds: 5, total_seconds: 120 }
  deepseek_anthropic:
    protocol: anthropic_messages
    base_url: https://api.deepseek.com/anthropic
    api_key: ${DEEPSEEK_API_KEY}
    enabled: true
    timeout: { connect_seconds: 5, total_seconds: 120 }
    headers: { anthropic-version: "2023-06-01" }
  broken_first:
    protocol: openai_responses
    base_url: https://deepseek-invalid-host.example.invalid   # deliberately unreachable
    api_key: ${DEEPSEEK_API_KEY}
    enabled: true
    timeout: { connect_seconds: 2, total_seconds: 5 }

aliases:
  deepseek-pro:
    strategy: priority
    routes: [ { provider: deepseek_responses, model: deepseek-v4-pro, weight: 1 } ]
  deepseek-flash:
    strategy: weighted
    routes: [ { provider: deepseek_anthropic, model: deepseek-v4-flash, weight: 1 } ]
  deepseek-pro-retry:
    strategy: priority
    routes:
      - { provider: broken_first, model: deepseek-v4-pro, weight: 1 }
      - { provider: deepseek_responses, model: deepseek-v4-pro, weight: 1 }

pricing:
  deepseek-pro:    { input_per_million: 4.0, output_per_million: 16.0, cache_input_per_million: 1.0 }
  deepseek-flash:  { input_per_million: 0.8, output_per_million: 3.2 }
  deepseek-pro-retry: { input_per_million: 4.0, output_per_million: 16.0 }
