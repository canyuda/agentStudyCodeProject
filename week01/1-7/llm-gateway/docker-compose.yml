services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./gateway.yaml:/app/gateway.yaml:ro
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 3
